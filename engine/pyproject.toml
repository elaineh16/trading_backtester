[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "trading-engine"
version = "0.2.0"
description = "Python bindings for the event-driven C++ trading engine"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/trading_engine"]
sdist.exclude = ["build"]

[tool.scikit-build.cmake.define]
TE_BUILD_PYTHON = "ON"
TE_BUILD_TESTS = "OFF"
TE_BUILD_BENCH = "OFF"
